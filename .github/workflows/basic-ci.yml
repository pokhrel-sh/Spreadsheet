name: Standard Workflow

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  Workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Packages
        run: cd implementation && npm install
      - name: Build
        run: cd implementation && npm run build
      - name: Test
        run: cd implementation && npm run test >> log.txt
      - name: Lint
        run: cd implementation && npm run lint
      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Test Report
          path: log.txt
      - name: Archive Lint Results
        uses: actions/upload-artifact@v4
        with:
          name: Lint Report
          path: log2.txt
